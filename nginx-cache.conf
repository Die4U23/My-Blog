# Include this file inside the site's `server { ... }` block.
# Keep these rules before any broader regular-expression asset locations.

# Directory-style permalinks expose clean URLs such as /posts/bitwise-toolbox/.
index index.html;

# Remove an explicitly typed index.html from public URLs. Using request_uri
# avoids redirecting Nginx's internal directory-index lookup.
if ($request_uri ~ ^(.*/)index\.html(?:\?.*)?$) {
    return 301 $1;
}

# Preserve bookmarks and search-engine entries for the former file-based URLs.
location = /about.html {
    return 301 /about/;
}

location = /posts/2026/06/post1.html {
    return 301 /posts/hello-world/;
}

location = /posts/2026/06/2026-06-04-测试博文.html {
    return 301 /posts/test-post/;
}

location = /posts/2026/06/2026-06-04-测试博文2.html {
    return 301 /posts/test-post-2/;
}

location = /posts/2026/06/2026-06-04-测试博文3.html {
    return 301 /posts/test-post-3/;
}

location = /posts/2026/06/2026-06-04-测试博文4.html {
    return 301 /posts/test-post-4/;
}

location = /posts/2026/06/2026-06-04-测试5.html {
    return 301 /posts/test-5/;
}

location = /posts/2026/07/2026-07-02-每日一题lc.html {
    return 301 /posts/leetcode-problem-list/;
}

location = /posts/2026/07/2026-07-05-Karrsalgorithm算法学习.html {
    return 301 /posts/karr-algorithm/;
}

location = /posts/2026/07/2026-07-14-对力扣938题的思考.html {
    return 301 /posts/leetcode-938-notes/;
}

location = /posts/2026/07/2026-07-15-test.html {
    return 301 /posts/test-page/;
}

location = /posts/2026/07/2026-07-15-力扣938题.html {
    return 301 /posts/range-sum-of-bst/;
}

location = /posts/2026/07/2026-07-16-在bitvector上模运算分析.html {
    return 301 /posts/bitvector-modular-analysis/;
}

location = /posts/2026/08/2026-08-14-STL.html {
    return 301 /posts/stl-notes/;
}

location = /posts/2026/08/2026-08-16-CPP知识记.html {
    return 301 /posts/cpp-knowledge-notes/;
}

location = /posts/2026/08/2026-08-18-从只出现一次的数字到位运算工具箱.html {
    return 301 /posts/bitwise-toolbox/;
}

location = /posts/2026/08/2026-08-19-排序简单整理.html {
    return 301 /posts/sorting-basics/;
}

# HTML must be revalidated so browsers can discover new asset versions.
location ~* \.html$ {
    expires off;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# CSS and JavaScript URLs carry a release version, so they can be cached safely.
location ~* \.(?:css|js)$ {
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
