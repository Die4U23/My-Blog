<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <style>
      .title { font: bold 20px sans-serif; fill: #2c3e50; }
      .subtitle { font: 14px sans-serif; fill: #7f8c8d; }
      .pass { fill: #2ecc71; }
      .text { font: 14px sans-serif; fill: white; }
      .label { font: 13px sans-serif; fill: #2c3e50; }
      .number { font: bold 24px sans-serif; fill: #2c3e50; }
      .category { font: bold 16px sans-serif; fill: #34495e; }
      .bar { fill: #3498db; }
      .bar-label { font: 12px sans-serif; fill: #2c3e50; }
    </style>
  </defs>

  <text x="500" y="35" text-anchor="middle" class="title">EvoRec 自动检查结果</text>
  <text x="500" y="60" text-anchor="middle" class="subtitle">M0 框架验证 - 55 项检查通过</text>

  <!-- 总体通过率 -->
  <circle cx="150" cy="150" r="70" class="pass"/>
  <text x="150" y="145" text-anchor="middle" class="number" fill="white">55</text>
  <text x="150" y="170" text-anchor="middle" class="text">项通过</text>

  <!-- 里程碑进度 -->
  <rect x="280" y="100" width="650" height="100" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="300" y="130" class="category">检查覆盖范围</text>
  <text x="300" y="155" class="label">• 首轮 23 项（基础契约与存活检查）</text>
  <text x="300" y="180" class="label">• 补充 32 项（请求绑定、过滤、超时、失败边界）</text>

  <!-- 分类统计 -->
  <text x="50" y="250" class="category">检查分类</text>

  <!-- API 契约 -->
  <rect x="50" y="270" width="400" height="50" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
  <rect x="50" y="270" width="320" height="50" class="bar" rx="3"/>
  <text x="60" y="300" class="text">API 契约检查 (20 项)</text>
  <text x="380" y="300" class="bar-label" font-weight="bold">20 / 20</text>

  <!-- 版本绑定 -->
  <rect x="50" y="335" width="400" height="50" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
  <rect x="50" y="335" width="280" height="50" class="bar" rx="3"/>
  <text x="60" y="365" class="text">版本绑定检查 (14 项)</text>
  <text x="340" y="365" class="bar-label" font-weight="bold">14 / 14</text>

  <!-- 边界保护 -->
  <rect x="50" y="400" width="400" height="50" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
  <rect x="50" y="400" width="240" height="50" class="bar" rx="3"/>
  <text x="60" y="430" class="text">边界保护检查 (12 项)</text>
  <text x="300" y="430" class="bar-label" font-weight="bold">12 / 12</text>

  <!-- 数据一致性 -->
  <rect x="50" y="465" width="400" height="50" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
  <rect x="50" y="465" width="180" height="50" class="bar" rx="3"/>
  <text x="60" y="495" class="text">数据一致性检查 (9 项)</text>
  <text x="240" y="495" class="bar-label" font-weight="bold">9 / 9</text>

  <!-- 关键验证点 -->
  <text x="530" y="250" class="category">关键验证点</text>
  <rect x="530" y="270" width="420" height="245" fill="#fff9e6" stroke="#f39c12" stroke-width="2" rx="5"/>

  <text x="550" y="300" class="label" font-weight="bold">✓ 请求 ID 生成与绑定</text>
  <text x="560" y="320" class="label">确保每次推荐可追溯</text>

  <text x="550" y="350" class="label" font-weight="bold">✓ 会话版本一致性</text>
  <text x="560" y="370" class="label">session_id 绑定 bundle 版本</text>

  <text x="550" y="400" class="label" font-weight="bold">✓ 商品过滤逻辑</text>
  <text x="560" y="420" class="label">已收藏、已屏蔽、已下架商品排除</text>

  <text x="550" y="450" class="label" font-weight="bold">✓ 超时与失败处理</text>
  <text x="560" y="470" class="label">降级策略与错误边界</text>

  <text x="550" y="500" class="label" font-weight="bold">✓ 反馈事件验证</text>
  <text x="560" y="520" class="label">action 类型、timestamp 格式检查</text>

  <!-- 未覆盖范围 -->
  <text x="50" y="560" class="category">当前未覆盖范围</text>
  <rect x="50" y="575" width="900" height="100" fill="#fee" stroke="#e74c3c" stroke-width="2" rx="5"/>

  <text x="70" y="605" class="label" style="fill: #c0392b;">✗ 推荐效果评估：需要真实数据与用户反馈</text>
  <text x="70" y="630" class="label" style="fill: #c0392b;">✗ 数据库事务完整性：需要 PostgreSQL 接入</text>
  <text x="70" y="655" class="label" style="fill: #c0392b;">✗ 真实模型推理：当前使用测试替身</text>
</svg>