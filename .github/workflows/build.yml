name: Blog CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify the checked-in Nginx document root
        run: |
          changes=$(git status --porcelain --untracked-files=all -- index.html about posts assets)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "Commit the pages and assets generated by npm run build."
            exit 1
          fi
          diff -qr --strip-trailing-cr dist/posts posts
      - name: Check generated pages and redesign screenshots
        run: |
          test -s dist/index.html
          test -s dist/about/index.html
          for post in content/posts/*/; do
            test -s "dist/posts/$(basename "$post")/index.html"
          done
          for image in home-before.png home-after.png; do
            test -s "dist/images/starry-blog-redesign/$image"
          done
